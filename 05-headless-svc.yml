apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: roboshop
spec:
  replicas: 4
  selector:
    matchLabels:
      project: roboshop
      purpose: nginx-headless-demo
    template:
      metadata:
        labels:
          project: roboshop
          purpose: nginx-headless-demo
      spec:
        containers:
        - name: nginx
          image: nginx:latest
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: roboshop
spec:
  selector:
    project: roboshop
    purpose: nginx-headless-demo
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
