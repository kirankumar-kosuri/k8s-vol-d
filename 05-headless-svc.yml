apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: roboshop
  labels:
    project: roboshop
    purpose: headless-svc
spec:
  replicas: 4
  selector:
    matchLabels: 
      project: roboshop
      purpose: headless-svc
  template:
    metadata:
      labels:
        project: roboshop
        purpose: headless-svc
    spec:
      containers:
        - name: nginx
          image: nginx
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: roboshop
spec:
  selector:
    project: roboshop
    purpose: headless-svc
  ports:
  - protocol: TCP 
    port: 80
    targetPort: 80